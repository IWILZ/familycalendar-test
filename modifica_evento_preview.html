<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aggiungi dettagli — FamilyCalendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#2e3b32;
    --paper:#fffdf6;
    --paper-edge:#eee6d3;
    --ink:#2b2b28;
    --ink-soft:#6b6659;
    --amber:#e8a33d;
    --amber-dark:#c9822a;
    --green-ok:#3f7d4f;
    --red-err:#b3432f;
    --ring:#8fd6ff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      radial-gradient(ellipse at 20% 0%, rgba(255,255,255,0.05), transparent 60%),
      var(--board);
    background-size: 3px 3px, auto, auto;
    font-family:'Atkinson Hyperlegible', Arial, sans-serif;
    color:var(--ink);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding: 28px 16px 60px;
  }
  @media (prefers-reduced-motion: no-preference){
    .note{ animation: settle .5s cubic-bezier(.2,.9,.3,1.1) both; }
    .chip, .btn-primary { transition: transform .12s ease, box-shadow .12s ease, background-color .12s ease; }
  }
  @keyframes settle{
    from{ transform: translateY(14px) rotate(0deg); opacity:0; }
    to{ transform: translateY(0) rotate(-0.6deg); opacity:1; }
  }

  .board-label{
    color: rgba(255,255,255,0.55);
    font-size: 14px;
    letter-spacing: .04em;
    text-align:center;
    margin: 0 0 18px;
  }

  .note{
    background: var(--paper);
    width: 100%;
    max-width: 420px;
    border-radius: 10px;
    padding: 30px 26px 26px;
    position: relative;
    transform: rotate(-0.6deg);
    box-shadow:
      0 18px 30px -10px rgba(0,0,0,0.45),
      0 2px 0 var(--paper-edge) inset;
  }
  .pin{
    position:absolute;
    top: -16px; left: 50%;
    transform: translateX(-50%);
    width: 30px; height: 30px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffd27a, var(--amber) 60%, var(--amber-dark));
    box-shadow: 0 4px 8px rgba(0,0,0,0.4);
  }

  .eyebrow{
    font-size: 15px;
    color: var(--ink-soft);
    margin: 6px 0 2px;
    min-height: 19px;
  }
  h1{
    font-size: 34px;
    line-height: 1.15;
    margin: 0 0 4px;
    font-weight: 700;
    min-height: 40px;
  }
  .when{
    font-size: 17px;
    color: var(--ink-soft);
    margin: 0 0 22px;
    min-height: 21px;
  }

  label{
    display:block;
    font-size: 19px;
    font-weight: 700;
    margin: 22px 0 10px;
  }
  label .opt{
    font-weight: 400;
    color: var(--ink-soft);
    font-size: 15px;
  }

  .chips{
    display:flex;
    flex-wrap:wrap;
    gap: 10px;
    margin-bottom: 12px;
  }
  .chip{
    font-family:inherit;
    font-size: 16px;
    padding: 10px 16px;
    border-radius: 999px;
    border: 2px solid var(--paper-edge);
    background: #fffefb;
    color: var(--ink);
    cursor:pointer;
  }
  .chip:hover{ border-color: var(--amber); }
  .chip:active{ transform: scale(0.97); }
  .chip.selected{
    background: var(--amber);
    border-color: var(--amber-dark);
    color: #2b1c04;
    font-weight: 700;
  }

  input[type=text], textarea{
    width: 100%;
    font-family: inherit;
    font-size: 22px;
    padding: 14px 16px;
    border-radius: 10px;
    border: 2px solid var(--paper-edge);
    background: #fffefb;
    color: var(--ink);
  }
  textarea{ min-height: 90px; resize: vertical; }
  input[type=text]::placeholder, textarea::placeholder{ color: #b9b2a0; }

  input:focus-visible, textarea:focus-visible, .chip:focus-visible, button:focus-visible{
    outline: 3px solid var(--ring);
    outline-offset: 2px;
  }

  .actions{
    display:flex;
    flex-direction:column;
    gap: 12px;
    margin-top: 30px;
  }
  .btn-primary{
    font-family:inherit;
    font-size: 22px;
    font-weight: 700;
    padding: 16px 20px;
    border-radius: 12px;
    border: none;
    background: var(--green-ok);
    color: white;
    cursor:pointer;
    box-shadow: 0 4px 0 #2c5c38;
  }
  .btn-primary:active{ transform: translateY(2px); box-shadow: 0 2px 0 #2c5c38; }
  .btn-primary:disabled{ opacity: 0.6; cursor: default; }
  .btn-secondary{
    font-family:inherit;
    font-size: 17px;
    padding: 10px;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    text-decoration: underline;
    cursor:pointer;
  }

  .stato{
    display:none;
    text-align:center;
    padding: 20px 0 6px;
  }
  .stato.show{ display:block; }
  .stato .tick{
    width:64px;height:64px;border-radius:50%;
    color:white;
    display:flex;align-items:center;justify-content:center;
    font-size:34px;
    margin: 0 auto 14px;
  }
  .stato.ok .tick{ background: var(--green-ok); }
  .stato.err .tick{ background: var(--red-err); }
  .stato p{ font-size:19px; margin:0; color:var(--ink); }
  .form-body.hide{ display:none; }

  .preview-tag{
    max-width:420px;
    margin: 16px auto 0;
    text-align:center;
    color: rgba(255,255,255,0.45);
    font-size: 13px;
  }
</style>
</head>
<body>
  <div style="width:100%; max-width:420px;">
    <p class="board-label">📌 lavagna di famiglia</p>

    <div class="note">
      <div class="pin"></div>

      <div class="form-body" id="form-body">
        <p class="eyebrow" id="persona-label">Caricamento…</p>
        <h1 id="event-title">&nbsp;</h1>
        <p class="when" id="event-when">&nbsp;</p>

        <label for="loc-input">Dove? <span class="opt">(facoltativo)</span></label>
        <div class="chips" id="loc-chips">
          <button type="button" class="chip" data-val="Pizzeria da Peppino, via Roma 34">Da Peppino</button>
          <button type="button" class="chip" data-val="Nonna Lina">Nonna Lina</button>
          <button type="button" class="chip" data-val="Studio Dott. Rossi">Dott. Rossi</button>
        </div>
        <input type="text" id="loc-input" placeholder="Scrivi un indirizzo o un nome…" />

        <label for="note-input">Note <span class="opt">(facoltativo)</span></label>
        <textarea id="note-input" placeholder="Es. portare la torta, vestiti eleganti…"></textarea>

        <div class="actions">
          <button class="btn-primary" id="btn-save">Salva</button>
          <button class="btn-secondary" id="btn-skip">Va bene così, non serve altro</button>
        </div>
      </div>

      <div class="stato" id="stato-block">
        <div class="tick" id="stato-tick">✓</div>
        <p id="stato-testo">…</p>
      </div>
    </div>

    <p class="preview-tag" id="footer-tag">Collegato a Google Calendar</p>
  </div>

<script>
  // ---- Configurazione ----
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyDr6B1kDVW8kjmM2cMGbYx5jjoEkfi5OrHSdpfEIxmxbsLrcU1bXkLqvJFdVQ6G8NF/exec";

  const params = new URLSearchParams(location.search);
  const idEvento = params.get('id');
  const token = params.get('token');

  const formBody = document.getElementById('form-body');
  const statoBlock = document.getElementById('stato-block');
  const statoTick = document.getElementById('stato-tick');
  const statoTesto = document.getElementById('stato-testo');
  const btnSave = document.getElementById('btn-save');
  const btnSkip = document.getElementById('btn-skip');
  const locInput = document.getElementById('loc-input');
  const noteInput = document.getElementById('note-input');

  function mostraStato(ok, testo) {
    formBody.classList.add('hide');
    statoBlock.classList.add('show');
    statoBlock.classList.add(ok ? 'ok' : 'err');
    statoTick.textContent = ok ? '✓' : '✕';
    statoTesto.textContent = testo;
  }

  // ---- Controllo parametri essenziali ----
  if (!idEvento || !token) {
    document.getElementById('persona-label').textContent = '';
    mostraStato(false, 'Link non valido: mancano i parametri necessari. Riprova a scansionare il QR dal device.');
  } else {
    caricaDettaglio();
  }

  // ---- Caricamento dettaglio evento ----
  async function caricaDettaglio() {
    try {
      const url = `${APPS_SCRIPT_URL}?azione=dettaglio&id=${encodeURIComponent(idEvento)}`;
      const risposta = await fetch(url);
      const dati = await risposta.json();

      if (!dati.ok) {
        mostraStato(false, 'Impossibile trovare questo evento: ' + (dati.errore || 'errore sconosciuto'));
        return;
      }

      const ev = dati.evento;
      document.getElementById('persona-label').textContent =
        (ev.persona === 'mamma' ? 'Mamma ha aggiunto' :
         ev.persona === 'papa'  ? 'Papà ha aggiunto'  : 'Evento');
      document.getElementById('event-title').textContent = ev.titolo;
      document.getElementById('event-when').textContent =
        formattaData(ev.giorno) + ', ' + ev.oraInizio + ' – ' + ev.oraFine;

      // Precompila con i valori già presenti, se l'evento viene riaperto
      if (ev.localita) locInput.value = ev.localita;
      if (ev.note) noteInput.value = ev.note;

    } catch (err) {
      mostraStato(false, 'Errore di connessione: verifica di essere online e riprova.');
    }
  }

  function formattaData(isoData) {
    // "2026-07-25" -> "sab 25/07"
    const giorni = ['dom','lun','mar','mer','gio','ven','sab'];
    const d = new Date(isoData + 'T00:00:00');
    const gg = String(d.getDate()).padStart(2, '0');
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    return giorni[d.getDay()] + ' ' + gg + '/' + mm;
  }

  // ---- Chip località rapide ----
  document.querySelectorAll('#loc-chips .chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('#loc-chips .chip').forEach(c => c.classList.remove('selected'));
      chip.classList.add('selected');
      locInput.value = chip.dataset.val;
    });
  });
  locInput.addEventListener('input', () => {
    document.querySelectorAll('#loc-chips .chip').forEach(c => c.classList.remove('selected'));
  });

  // ---- Salvataggio ----
  async function salva() {
    btnSave.disabled = true;
    btnSave.textContent = 'Salvataggio…';

    try {
      const url = `${APPS_SCRIPT_URL}?azione=aggiorna`
        + `&id=${encodeURIComponent(idEvento)}`
        + `&token=${encodeURIComponent(token)}`
        + `&localita=${encodeURIComponent(locInput.value)}`
        + `&note=${encodeURIComponent(noteInput.value)}`;

      const risposta = await fetch(url);
      const dati = await risposta.json();

      if (dati.ok) {
        mostraStato(true, 'Aggiunto! Ora è visibile anche sul display in cucina.');
      } else {
        mostraStato(false, 'Non è stato possibile salvare: ' + (dati.errore || 'errore sconosciuto'));
        btnSave.disabled = false;
        btnSave.textContent = 'Salva';
      }
    } catch (err) {
      mostraStato(false, 'Errore di connessione: verifica di essere online e riprova.');
      btnSave.disabled = false;
      btnSave.textContent = 'Salva';
    }
  }

  btnSave.addEventListener('click', salva);
  btnSkip.addEventListener('click', () => {
    mostraStato(true, 'Va bene così, nessuna modifica salvata.');
  });
</script>
</body>
</html>
